<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>PANZERKNACKER</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game">
    <button id="pauseBtn" title="Pause">&#10073;&#10073;</button>
    <button id="muteBtn" title="Ton an/aus">&#9835;</button>
    <button id="endlessBtn" class="hidden">Endlos weiterspielen &#8594;</button>
    <button id="dashBtn" class="hidden">DASH</button>
    <canvas id="canvas" width="768" height="512"></canvas>
    <div id="rotate" class="overlay rotate-overlay">
      <h1>&#8635;</h1>
      <p>Bitte Ger&auml;t drehen</p>
    </div>
    <p class="hint">WASD: fahren &middot; Maus: zielen &middot; Klick/rechts: schie&szlig;en/Bombe &middot; Leertaste: Bombe &middot; Q: Gadget &middot; E: z&uuml;nden &middot; Tab: Werte</p>
    <div id="start" class="overlay">
      <h1>PANZERKNACKER</h1>
      <div id="modeSelect" class="modes">
        <button data-mode="leicht">Leicht</button>
        <button data-mode="normal" class="active">Normal</button>
        <button data-mode="schwer">Schwer</button>
      </div>
      <!-- Phase 3: Kurzbeschreibung der Auswirkung der gewaehlten Stufe. -->
      <p id="modeDesc" class="modedesc"></p>
      <!-- Phase 9: Klassenwahl. Button oeffnet eine eigene Seite (Muster wie
           Ausruestung/Einstellungen aus P8/P9), damit die zehn Klassen mit
           Werten den Startbildschirm im Handy-Querformat nicht sprengen. -->
      <button id="classOpen" class="secondary">Klasse: Standard &#9656;</button>
      <label for="seedInput">Seed (leer = zufällig)</label>
      <input id="seedInput" inputmode="numeric" autocomplete="off" placeholder="z.B. 4711" />
      <button id="resumeBtn" class="hidden">Run fortsetzen</button>
      <button id="startBtn">Start</button>
      <button id="dailyBtn" class="secondary">Tages-Seed spielen</button>
      <div class="opts">
        <label><input type="checkbox" id="optThreat" checked /> Bedrohungslinien</label>
        <label><input type="checkbox" id="optMotion" /> Reduzierte Bewegung</label>
        <label><input type="checkbox" id="optAim" checked /> Ziellinie</label>
      </div>
      <p id="beststats" class="beststats"></p>
      <!-- P9: Vollbild/Lautstaerke/Eingabeprofil/Reset/Beenden liegen auf
           einer eigenen Seite -- gleiches Muster wie die Ausruestungsseite
           aus P8. Alle fuenf zusaetzlich auf den Hauptbildschirm gepackt
           liess ihn im Handy-Querformat nicht mehr ohne Scrollen passen
           (gemessen: 6-7 Bedienelemente unterhalb des sichtbaren Bereichs
           bei 667x375 -- derselbe Fehlerfall wie beim "Weiter"-Knopf). -->
      <button id="settingsOpen" class="secondary">Einstellungen &#9656;</button>
    </div>
    <div id="settings" class="overlay hidden">
      <h1>Einstellungen</h1>
      <!-- P2 legt den Knopf an und blendet ihn ein, wenn der Browser
           Element-Vollbild kann (iOS kann es nicht -> bleibt versteckt). -->
      <button id="fullscreenBtn" class="secondary hidden">Vollbild</button>
      <!-- Phase 4: Sound-Bereich -- Gesamt/Musik/Effekte getrennt regelbar,
           10%-Schritte (auch per Pfeiltasten/D-Pad, siehe menunav.js). -->
      <div class="soundsection" role="group" aria-label="Sound">
        <label class="volumelabel" for="volMaster">Gesamt
          <input type="range" id="volMaster" min="0" max="100" step="10" value="100" />
        </label>
        <label class="volumelabel" for="volMusic">Musik
          <input type="range" id="volMusic" min="0" max="100" step="10" value="100" />
        </label>
        <label class="volumelabel" for="volSfx">Effekte
          <input type="range" id="volSfx" min="0" max="100" step="10" value="100" />
        </label>
      </div>
      <!-- P9: Eingabeprofil-Override (P1 hat setProfile()/getProfile()
           bereits gebaut). Knopfreihe statt <select> -- gleiches Muster wie
           die Schwierigkeitsauswahl, jeder Knopf ein eigener Fokusstopp
           fuer die Tastatur-/Gamepad-Navigation. -->
      <div id="profileSelect" class="modes profiles" role="group" aria-label="Eingabeprofil">
        <button data-profile="" class="active">Automatisch</button>
        <button data-profile="touch">Touch</button>
        <button data-profile="keyboard">Tastatur/Maus</button>
        <button data-profile="gamepad">Gamepad</button>
      </div>
      <button id="resetBtn" class="linklike">Bestwerte zur&uuml;cksetzen</button>
      <button id="quitBtn" class="linklike">Spiel beenden</button>
      <button id="settingsBack">Zur&uuml;ck</button>
    </div>
    <!-- Phase 9: Klassenauswahl -- die zehn spielbaren Panzer mit Werten.
         main.js fuellt #classList aus tanks.json (player:true). -->
    <div id="classScreen" class="overlay hidden">
      <h1>Klasse w&auml;hlen</h1>
      <div id="classList" class="classlist"></div>
      <button id="classBack">Zur&uuml;ck</button>
    </div>
    <!-- Phase 4: echtes Pause-Overlay (bisher nur Canvas-Text + Tastatur
         R/M). Einstellungen sind von hier aus mit from:'pause' erreichbar --
         der Menue-Stack fuehrt "Zurueck" dann hierher, nicht ins Hauptmenue. -->
    <div id="pauseMenu" class="overlay hidden">
      <h1>Pause</h1>
      <button id="pauseResume">Fortsetzen</button>
      <button id="pauseSettings" class="secondary">Einstellungen &#9656;</button>
      <button id="pauseRestart" class="secondary">Neustart (gleicher Seed)</button>
      <button id="pauseHome" class="linklike">Hauptmen&uuml;</button>
    </div>
  </main>
  <!-- Inline-Guard laeuft auch bei file:// (wo Modul-Skripte blockiert
       werden). Zeigt einen Hinweis, statt einen schwarzen Bildschirm. -->
  <script>
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var b = document.createElement('div');
        b.style.cssText =
          'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
          'padding:24px;background:#14141a;color:#e8e4d8;font-family:monospace;font-size:15px;' +
          'text-align:center;white-space:pre-wrap;z-index:99;line-height:1.6';
        b.textContent =
          'PANZERKNACKER läuft nicht per Doppelklick (file://).\n\n' +
          'Bitte über einen Webserver öffnen — z. B. im Projektordner:\n' +
          '  npx serve .   (dann http://localhost:3000)\n\n' +
          'oder die veröffentlichte URL (GitHub Pages) verwenden.';
        document.body.appendChild(b);
      });
    } else {
      window.addEventListener('error', function (e) {
        if (!/main\.js|src\//.test(e.filename || '')) return;
        var b = document.createElement('div');
        b.style.cssText =
          'position:fixed;bottom:0;left:0;right:0;padding:10px;background:#601010;' +
          'color:#fff;font-family:monospace;font-size:12px;z-index:99';
        b.textContent = 'Fehler: ' + e.message + ' (' + (e.filename || '') + ':' + e.lineno + ')';
        document.body.appendChild(b);
      });
    }
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
